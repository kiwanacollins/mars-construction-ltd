services:
  app:
    build: .
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-mars_estate}
      DB_USER: ${DB_USER:-mars}
      DB_PASS: ${DB_PASS}
    volumes:
      - uploads_data:/var/www/html/Admin/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-mars_estate}
      MYSQL_USER: ${DB_USER:-mars}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
  uploads_data:
